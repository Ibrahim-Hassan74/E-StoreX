<div class="min-h-screen bg-gray-50 dark:bg-gray-900 flex items-center justify-center px-4">
  <div class="max-w-md w-full text-center">
    <div class="relative mb-8">
      <h1 class="text-9xl font-extrabold text-[#029fae]/20 tracking-widest select-none">404</h1>
      <div class="absolute inset-0 flex items-center justify-center">
        <span class="text-xl font-semibold bg-white dark:bg-gray-900 px-4 py-1 rounded-md text-gray-900 dark:text-white border border-gray-100 dark:border-gray-800">
          {{ 'not-found.title' | translate }}
        </span>
      </div>
    </div>
    
    <p class="text-gray-600 dark:text-gray-400 mb-8 max-w-sm mx-auto">
      {{ 'not-found.desc' | translate }}
    </p>

    <a routerLink="/" class="inline-flex items-center gap-2 bg-[#029fae] hover:bg-[#028b99] text-white font-bold px-6 py-3 rounded-xl transition-all shadow-lg shadow-[#029fae]/20 cursor-pointer">
      {{ 'not-found.backBtn' | translate }}
    </a>
  </div>
</div>
