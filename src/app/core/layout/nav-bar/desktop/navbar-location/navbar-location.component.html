<div
  class="hidden md:flex gap-2 cursor-pointer text-gray-600 dark:text-gray-300 items-center hover:text-[#029fae] relative"
  (click)="toggleLocation()"
>
  <lucide-icon
    name="map-pin"
    size="20"
    class="w-5 h-5 text-[#029fae]"
  ></lucide-icon>

  <span class="font-medium truncate max-w-[200px]" [title]="currentAddress() || ('layout.location.add_address' | translate)">
    {{ currentAddress() || ('layout.location.add_address' | translate) }}
  </span>

  <lucide-icon
    name="chevron-down"
    size="16"
    class="w-4 h-4 ms-1 transition-transform duration-200"
    [class.rotate-180]="isLocationOpen()"
  ></lucide-icon>

  @if(isLocationOpen()) {
  <div
    class="absolute top-full start-0 mt-2 w-[320px] z-50 shadow-xl bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-2xl p-5"
    (click)="$event.stopPropagation()"
  >
    <div
      class="flex justify-between items-center border-b border-gray-200 dark:border-gray-700 pb-3 mb-4"
    >
      <h1 class="font-semibold text-lg text-gray-800 dark:text-gray-100">
        {{ 'layout.location.change_location' | translate }}
      </h1>
      <div
        class="w-5 h-5 cursor-pointer text-gray-500 dark:text-gray-400 hover:text-red-500 transition"
        (click)="closeLocation()"
      >
        <lucide-icon name="x" size="20"></lucide-icon>
      </div>
    </div>

    <div class="flex flex-col gap-3">
      <button
        (click)="detectMyLocation()"
        [disabled]="isLoading()"
        class="flex items-center justify-center gap-2 bg-[#029fae] hover:bg-[#04b5c6] text-white dark:text-gray-100 px-4 py-2 rounded-lg cursor-pointer transition disabled:opacity-70 disabled:cursor-not-allowed"
      >
        @if (isLoading()) {
          <span class="animate-spin">⌛</span>
          {{ 'layout.location.detecting' | translate }}
        } @else {
          <lucide-icon name="crosshair" size="16"></lucide-icon>
          {{ 'layout.location.detect_my_location' | translate }}
        }
      </button>
    </div>
  </div>
  }
</div>
