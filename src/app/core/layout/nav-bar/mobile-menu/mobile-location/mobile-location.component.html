<button
  class="flex items-center gap-2 text-gray-700 dark:text-gray-300 font-medium py-2 rounded hover:bg-gray-100 dark:hover:bg-gray-700 hover:text-[#029fae] transition"
  (click)="toggleLocation()"
>
  <lucide-icon name="map-pin" size="20" class="text-[#029fae]"></lucide-icon>
  <span class="truncate max-w-[200px]">{{ currentAddress() || ('layout.location.add_address' | translate) }}</span>
</button>

@if(isLocationOpen()) {
<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/40"
  (click)="closeLocation()"
>
  <div
    class="bg-white dark:bg-gray-900 w-[90%] max-w-md rounded-2xl shadow-2xl p-6 relative"
    (click)="$event.stopPropagation()"
  >
    <button
      class="absolute top-3 end-3 text-gray-500 dark:text-gray-400 hover:text-red-500 transition"
      (click)="closeLocation()"
    >
      <lucide-icon name="x" size="20"></lucide-icon>
    </button>

    <h1 class="font-semibold text-xl text-gray-800 dark:text-gray-100 mb-4">
      {{ 'layout.location.change_location' | translate }}
    </h1>

    <div class="flex flex-col gap-3">
      <button
        (click)="detectMyLocation()"
        [disabled]="isLoading()"
        class="flex items-center justify-center gap-2 bg-[#029fae] text-white px-4 py-2 rounded-lg cursor-pointer hover:bg-[#04b5c6] transition disabled:opacity-70 disabled:cursor-not-allowed"
      >
        @if (isLoading()) {
          <lucide-icon name="loader-2" size="16" class="animate-spin"></lucide-icon>
          {{ 'layout.location.detecting' | translate }}
        } @else {
          <lucide-icon name="crosshair" size="16"></lucide-icon>
          {{ 'layout.location.detect_my_location' | translate }}
        }
      </button>
    </div>
  </div>
</div>
}
