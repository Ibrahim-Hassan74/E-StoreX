<div class="flex flex-col space-y-4">
  <a
    routerLink="/"
    routerLinkActive="active-link"
    [routerLinkActiveOptions]="{ exact: true }"
    class="block text-xl font-semibold text-center py-2 text-gray-800 dark:text-gray-200 hover:text-[#029fae] dark:hover:text-[#029fae] transition"
  >
    {{ 'layout.navbar.home' | translate }}
  </a>

  <a
    routerLink="/product"
    routerLinkActive="active-link"
    class="block text-xl font-semibold text-center py-2 text-gray-800 dark:text-gray-200 hover:text-[#029fae] dark:hover:text-[#029fae] transition"
  >
    {{ 'layout.navbar.product' | translate }}
  </a>

  <a
    routerLink="/about"
    routerLinkActive="active-link"
    class="block text-xl font-semibold text-center py-2 text-gray-800 dark:text-gray-200 hover:text-[#029fae] dark:hover:text-[#029fae] transition"
  >
    {{ 'layout.navbar.about' | translate }}
  </a>

  <a
    routerLink="/contact"
    routerLinkActive="active-link"
    class="block text-xl font-semibold text-center py-2 text-gray-800 dark:text-gray-200 hover:text-[#029fae] dark:hover:text-[#029fae] transition"
  >
    {{ 'layout.navbar.contact' | translate }}
  </a>
</div>
